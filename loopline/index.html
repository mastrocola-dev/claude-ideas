<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#14112b" />
    <title>Loopline</title>
    <link rel="icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="src/ui/style.css" />
  </head>
  <body>
    <main id="game" hidden>
      <header class="hud">
        <button type="button" id="home" aria-label="Menu">☰</button>
        <h1 id="level-label">Level 1</h1>
        <button type="button" id="restart" aria-label="Restart">↻</button>
      </header>
      <section id="bins" class="bins" aria-label="Bins"></section>
      <canvas id="board" aria-label="Board"></canvas>
      <nav class="boosters" aria-label="Boosters">
        <button type="button" id="undo" aria-label="Undo">↶</button>
        <button type="button" id="widen" aria-label="Extra loop slot">＋</button>
        <button type="button" id="reverse" aria-label="Reverse bin order">⇄</button>
      </nav>
      <p id="hint" class="hint"></p>
    </main>

    <section id="title" class="screen">
      <h1 class="logo">Loop<span>line</span></h1>
      <p class="tagline">Free the arrows. Feed the loop.</p>
      <button type="button" id="play" class="primary">Play</button>
      <button type="button" id="daily" class="secondary">Daily Loop</button>
      <button type="button" id="choose" class="secondary">Levels</button>
      <button type="button" id="sound" class="ghost">Sound on</button>
    </section>

    <section id="levels" class="screen" hidden>
      <h2>Levels</h2>
      <div id="level-grid" class="level-grid"></div>
      <button type="button" id="back" class="secondary">Back</button>
    </section>

    <section id="result" class="screen overlay" hidden>
      <h2 id="result-title">Result</h2>
      <p id="result-stars" class="stars"></p>
      <button type="button" id="result-next" class="primary"></button>
      <button type="button" id="result-share" class="secondary" hidden>Share</button>
      <button type="button" id="result-menu" class="ghost">Menu</button>
    </section>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
